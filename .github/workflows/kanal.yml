name: kanal
# Публикация постов из kanal/ochered, сторож графика ДТЕК и замер подписчиков — без компьютера Ферума.
#
# Почему «дежурство», а не cron каждые 15 минут (24.11.2026): расписание GitHub на деле срабатывает
# раз в 4–12 часов, посты опаздывали больше чем на 2 часа и не выходили. Теперь одна «смена» живёт
# ~5 ч 45 мин и каждые 5 минут (ночью — каждые 20) проверяет очередь; в конце сама запускает
# следующую смену (workflow_dispatch от GITHUB_TOKEN разрешён). Cron и push остаются запасным
# стартом, если цепочка оборвётся. Одновременно работает только одна смена (concurrency).
on:
  schedule:
    - cron: "2,32 * * * *"
  push:
    paths: ["kanal/ochered/**"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: kanal
  cancel-in-progress: false
jobs:
  kanal:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      TZ: Europe/Kyiv
      VECHIRNIJ_PAPKA: ${{ github.workspace }}/kanal
      VECHIRNIJ_MEDIA: ${{ github.workspace }}
      VECHIRNIJ_OFORMLENIE: ${{ github.workspace }}/kanal/oformlenie
      VECHIRNIJ_KARTINKY: ${{ github.workspace }}/kanal/kartinky
      VECHIRNIJ_BEZ_PUBLIKACII: "1"
      VIBER_CHANNEL_TOKEN: ${{ secrets.VIBER_CHANNEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow
      # Видеопосты: post_queue.py вызывает ffprobe. Без него 25.11 видео «ОСББ району» упало и просрочилось.
      - name: ffmpeg для видео
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && ffprobe -version | head -1
        continue-on-error: true
      - run: |
          git config user.name "vechirnij-kanal"
          git config user.email "ferum3000@users.noreply.github.com"
      - name: Проверка токена
        run: |
          python3 -c "import json,os,urllib.request as u; r=u.Request('https://chatapi.viber.com/pa/get_account_info',data=json.dumps({'auth_token':os.environ['VIBER_CHANNEL_TOKEN']}).encode(),headers={'Content-Type':'application/json'}); d=json.load(u.urlopen(r,timeout=30)); print('Viber:', d.get('status'), d.get('status_message')); exit(d.get('status'))"
      # Следующая смена ставится в очередь СРАЗУ, в начале этой: она ждёт (concurrency) и стартует, как только
      # эта закончится, даже если эта упадёт. 25.11 запуск в конце смены один раз не прошёл — канал молчал 18:05–21:52,
      # пост 19:00 просрочился.
      - name: Следующая смена в очередь
        env:
          GH_TOKEN: ${{ github.token }}
        run: for i in 1 2 3 4 5; do gh workflow run kanal.yml --ref main && exit 0; sleep 20; done; echo "не поставилась, подстрахует конец смены"
      - name: Дежурство (каждые 5 минут, ~5 ч 45 мин)
        run: |
          set +e  # одна ошибка (сайт лёг, push не прошёл) не должна обрывать смену
          konec=$(( $(date +%s) + 345*60 ))
          zamer=""
          while :; do
            git pull --rebase -q || { git rebase --abort 2>/dev/null; git fetch -q && git reset -q --hard origin/main; }
            h=$((10#$(date +%H)))
            # Ночью сторож ДТЕК молчит (публиковать всё равно нельзя), утром проверит сам.
            if [ $h -ge 7 ] && [ $h -lt 22 ]; then python3 scripts/dtek_watch.py || echo "сторож ДТЕК: ошибка (в post.log)"; fi
            # Утренняя карточка 07:10–07:29, если Claude на компьютере её не приготовил (scripts/ranok.py).
            python3 scripts/ranok.py || echo "утренняя карточка: ошибка (в post.log)"
            python3 scripts/post_queue.py || echo "очередь: ошибка (в post.log)"
            ch=$(date +%Y%m%d%H)
            if [ "$ch" != "$zamer" ]; then python3 scripts/viber_stats.py && zamer=$ch || echo "замер подписчиков: ошибка"; fi
            git add -A kanal stats
            git commit -q -m "kanal: $(date '+%d.%m %H:%M')" || true
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
            [ $(date +%s) -ge $konec ] && break
            if [ $h -ge 22 ] || [ $h -lt 6 ]; then sleep 1200; else sleep 300; fi
          done
      - name: Следующая смена (страховка)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Если в очереди уже есть смена, ничего не делаем; иначе ставим, с повторами.
          if [ -n "$(gh run list -w kanal.yml -s pending -L 1 --json databaseId -q '.[].databaseId')" ]; then echo "смена уже ждёт"; exit 0; fi
          for i in 1 2 3 4 5; do gh workflow run kanal.yml --ref main && exit 0; sleep 20; done; exit 1
