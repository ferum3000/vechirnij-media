name: pidpysnyky
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  zamer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/viber_stats.py
      - run: |
          git config user.name "vechirnij-stats"
          git config user.email "ferum3000@users.noreply.github.com"
          git add stats/pidpysnyky.csv
          git commit -m "zamer pidpysnykiv" || exit 0
          git pull --rebase
          git push
